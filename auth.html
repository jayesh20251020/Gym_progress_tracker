<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>IronLog — Login</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #0b0d10;

            color: #ffffff;

            font-family: Arial, sans-serif;

            padding: 20px;
        }


        .auth-box {

            width: 100%;

            max-width: 420px;

            background: #15181d;

            border: 1px solid #292e36;

            border-radius: 16px;

            padding: 32px;
        }


        h1 {

            text-align: center;

            margin-bottom: 8px;
        }


        .subtitle {

            text-align: center;

            color: #8f96a3;

            margin-bottom: 28px;
        }


        .tabs {

            display: flex;

            gap: 8px;

            margin-bottom: 24px;
        }


        .tabs button {

            flex: 1;

            padding: 12px;

            border: 0;

            border-radius: 8px;

            background: #22262d;

            color: #aaa;

            cursor: pointer;
        }


        .tabs button.active {

            background: #ffffff;

            color: #000000;
        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #c5cad3;
        }


        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 18px;

            border: 1px solid #303640;

            border-radius: 8px;

            background: #0f1115;

            color: white;

            font-size: 15px;
        }


        input:focus {

            outline: none;

            border-color: #ffffff;
        }


        .submit-btn {

            width: 100%;

            padding: 14px;

            border: 0;

            border-radius: 8px;

            background: #ffffff;

            color: #000000;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }


        .submit-btn:hover {

            opacity: 0.9;
        }


        #message {

            margin-top: 16px;

            text-align: center;

            color: #ff7777;

            min-height: 20px;
        }

    </style>

</head>


<body>


    <div class="auth-box">

        <h1>IronLog</h1>

        <p class="subtitle">
            Track your training. Build your progress.
        </p>


        <div class="tabs">

            <button
                id="loginTab"
                class="active"
            >
                Login
            </button>


            <button id="registerTab">
                Create Account
            </button>

        </div>


        <form id="authForm">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="you@example.com"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="At least 8 characters"
                required
            >


            <button
                type="submit"
                class="submit-btn"
                id="submitBtn"
            >
                Login
            </button>

        </form>


        <div id="message"></div>

    </div>


    <script src="js/config.js"></script>

    <script>

        // =============================================================
        // CONFIG
        // =============================================================

        const API_URL = window.IRONLOG_CONFIG.API_BASE;


        // =============================================================
        // ELEMENTS
        // =============================================================

        let mode = "login";

        const loginTab =
            document.getElementById("loginTab");

        const registerTab =
            document.getElementById("registerTab");

        const authForm =
            document.getElementById("authForm");

        const submitBtn =
            document.getElementById("submitBtn");

        const message =
            document.getElementById("message");


        // =============================================================
        // CHECK EXISTING LOGIN
        // =============================================================

        async function checkExistingLogin() {

            try {

                const response = await fetch(
                    `${API_URL}/api/me`,
                    {
                        method: "GET",

                        credentials: "include"
                    }
                );


                // -----------------------------------------------------
                // Already logged in
                // -----------------------------------------------------

                if (response.ok) {

                    console.log(
                        "Already logged in. Redirecting..."
                    );

                    window.location.href = "index.html";

                    return;
                }


                // -----------------------------------------------------
                // Not logged in
                // -----------------------------------------------------

                console.log(
                    "No active login session."
                );

            } catch (error) {

                console.error(
                    "Could not check login session:",
                    error
                );

            }

        }


        // Run immediately when auth.html opens
        checkExistingLogin();


        // =============================================================
        // LOGIN TAB
        // =============================================================

        loginTab.addEventListener(
            "click",
            () => {

                mode = "login";


                loginTab.classList.add(
                    "active"
                );

                registerTab.classList.remove(
                    "active"
                );


                submitBtn.textContent =
                    "Login";


                message.textContent = "";

                message.style.color =
                    "#ff7777";

            }
        );


        // =============================================================
        // REGISTER TAB
        // =============================================================

        registerTab.addEventListener(
            "click",
            () => {

                mode = "register";


                registerTab.classList.add(
                    "active"
                );

                loginTab.classList.remove(
                    "active"
                );


                submitBtn.textContent =
                    "Create Account";


                message.textContent = "";

                message.style.color =
                    "#ff7777";

            }
        );


        // =============================================================
        // LOGIN / REGISTER
        // =============================================================

        authForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                message.style.color =
                    "#ff7777";


                message.textContent =
                    "Please wait...";


                submitBtn.disabled = true;


                try {

                    const response = await fetch(
                        `${API_URL}/api/${mode}`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials: "include",

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        }
                    );


                    const data =
                        await response.json();


                    // -------------------------------------------------
                    // ERROR
                    // -------------------------------------------------

                    if (!response.ok) {

                        message.style.color =
                            "#ff7777";

                        message.textContent =
                            data.error ||
                            "Something went wrong.";

                        submitBtn.disabled =
                            false;

                        return;
                    }


                    // -------------------------------------------------
                    // SUCCESS
                    // -------------------------------------------------

                    message.style.color =
                        "#77ff99";

                    message.textContent =
                        data.message;


                    // -------------------------------------------------
                    // REGISTER
                    // -------------------------------------------------

                    if (mode === "register") {

                        setTimeout(
                            () => {

                                mode = "login";

                                loginTab.click();


                                document
                                    .getElementById(
                                        "password"
                                    )
                                    .value = "";


                                message.style.color =
                                    "#77ff99";


                                message.textContent =
                                    "Account created. You can now login.";


                                submitBtn.disabled =
                                    false;

                            },
                            800
                        );

                    }


                    // -------------------------------------------------
                    // LOGIN
                    // -------------------------------------------------

                    else {

                        setTimeout(
                            () => {

                                window.location.href =
                                    "index.html";

                            },
                            500
                        );

                    }

                } catch (error) {

                    console.error(error);


                    message.style.color =
                        "#ff7777";


                    message.textContent =
                        "Could not connect to the IronLog server.";


                    submitBtn.disabled =
                        false;

                }

            }
        );

    </script>

</body>

</html>
